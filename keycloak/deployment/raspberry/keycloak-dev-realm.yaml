--- # Ansible Playbook to create (or delete) the windfire-dev realm on the raspberry01 Keycloak, for local development
# Run with keycloak/deployment/create-dev-realm.sh ([--remove] [-y]); settings in conf/keycloak-dev-realm-config.yml.
# Keycloak's hostname is the public URL (keycloak_public_url): every frontend URL of a realm (login form, resources,
# redirects) goes to it unless the realm has its own Frontend URL. The dev realm gets the internal URL as Frontend URL,
# exactly like the master realm in keycloak-tls-deploy.yaml, so a local UI logs in on raspberry01:8443 only.
# Everything runs on the controller through the admin REST API as admin-cli (WINDFIRE_KC_ADMIN_USERNAME/PASSWORD,
# asked when unset, plus an OTP code): no SSH and no sudo on the Pi. keycloak.conf, the source realm, the tunnel and
# Cloudflare Access are never changed.
- hosts: identitymanager
  connection: local
  gather_facts: no
  become: no
  vars:
    src_dir: "{{ playbook_dir }}"
    dev_issuer: "{{ keycloak_internal_url }}/realms/{{ keycloak_dev_realm }}"
  vars_files:
    - "{{ src_dir }}/conf/raspberry-config.yml"
    - "{{ src_dir }}/conf/keycloak-tls-config.yml"
    - "{{ src_dir }}/conf/keycloak-dev-realm-config.yml"
  tasks:
    #############################
    ##### Pre-flight checks #####
    #############################
    - name: Fail on unknown keycloak_dev_realm_state
      assert:
        that: keycloak_dev_realm_state in ['present', 'absent']
        fail_msg: "keycloak_dev_realm_state must be present or absent, not {{ keycloak_dev_realm_state }}"
        quiet: true
      run_once: true
    - name: Fail if the dev realm is the source realm or master
      assert:
        that: keycloak_dev_realm not in [keycloak_dev_source_realm, 'master']
        fail_msg: "keycloak_dev_realm ({{ keycloak_dev_realm }}) must differ from {{ keycloak_dev_source_realm }} and master"
        quiet: true
      run_once: true
    - name: Check the Windfire Keycloak Root CA exists
      stat:
        path: "{{ local_root_ca_cert }}"
      register: local_root_ca
      run_once: true
    - name: Fail if the Windfire Keycloak Root CA is missing
      assert:
        that: local_root_ca.stat.exists
        fail_msg: "{{ local_root_ca_cert }} not found, create it with keycloak/security/setupTLS.sh"
        quiet: true
      run_once: true
    - name: Read the dev realm discovery document on "{{ keycloak_internal_url }}"
      uri:
        url: "{{ dev_issuer }}/.well-known/openid-configuration"
        ca_path: "{{ local_root_ca_cert }}"
        validate_certs: yes
        return_content: yes
        status_code: [200, 404]
      register: dev_discovery_before
      run_once: true
    - name: Set dev realm facts
      set_fact:
        dev_realm_exists: "{{ dev_discovery_before.status == 200 }}"
      run_once: true
    - name: Nothing to do, the dev realm does not exist
      debug:
        msg: "Realm {{ keycloak_dev_realm }} does not exist on {{ keycloak_internal_url }}: nothing removed"
      when: keycloak_dev_realm_state == 'absent' and not dev_realm_exists
      run_once: true
    - name: End the play (nothing to remove)
      meta: end_play
      when: keycloak_dev_realm_state == 'absent' and not dev_realm_exists
    - name: Ask for the Keycloak admin credentials
      import_tasks: tasks/keycloak-admin-credentials.yaml
      run_once: true
    - name: Get an admin token
      import_tasks: tasks/keycloak-admin-token.yaml
      run_once: true

    ###########################
    ##### Remove (absent) #####
    ###########################
    - name: Delete the dev realm "{{ keycloak_dev_realm }}"
      uri:
        url: "{{ keycloak_internal_url }}/admin/realms/{{ keycloak_dev_realm }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ kc_admin_token.json.access_token }}"
        ca_path: "{{ local_root_ca_cert }}"
        validate_certs: yes
        status_code: 204
      changed_when: true
      no_log: true
      when: keycloak_dev_realm_state == 'absent'
      run_once: true
    - name: End the play (dev realm removed)
      meta: end_play
      when: keycloak_dev_realm_state == 'absent'

    ############################
    ##### Create (present) #####
    ############################
    - name: Create the dev realm from "{{ keycloak_dev_source_realm }}"
      when: not dev_realm_exists
      run_once: true
      block:
        - name: Partial export of "{{ keycloak_dev_source_realm }}" (read only, secrets masked, no users)
          uri:
            url: "{{ keycloak_internal_url }}/admin/realms/{{ keycloak_dev_source_realm }}/partial-export?exportClients=true&exportGroupsAndRoles=true"
            method: POST
            headers:
              Authorization: "Bearer {{ kc_admin_token.json.access_token }}"
            ca_path: "{{ local_root_ca_cert }}"
            validate_certs: yes
            return_content: yes
          register: source_export
          no_log: true
        - name: Create realm "{{ keycloak_dev_realm }}" with Frontend URL "{{ keycloak_internal_url }}"
          uri:
            url: "{{ keycloak_internal_url }}/admin/realms"
            method: POST
            headers:
              Authorization: "Bearer {{ kc_admin_token.json.access_token }}"
            body_format: json
            body: "{{ source_export.json | keycloak_realm_copy(keycloak_dev_realm, keycloak_dev_realm_display_name, keycloak_internal_url) }}"
            ca_path: "{{ local_root_ca_cert }}"
            validate_certs: yes
            return_content: yes
            status_code: [201, 400, 409, 500]
          register: dev_realm_create
          changed_when: dev_realm_create.status == 201
          no_log: true
        - name: Fail if Keycloak refused the dev realm
          assert:
            that: dev_realm_create.status == 201
            fail_msg: >-
              Keycloak refused to create {{ keycloak_dev_realm }}: HTTP {{ dev_realm_create.status }},
              {{ dev_realm_create.json.errorMessage | default(dev_realm_create.json.error | default(dev_realm_create.content | default('?') | truncate(300))) }}.
              Details: sudo journalctl -u {{ keycloak_service }} on {{ inventory_hostname }}.
              If the realm was created halfway, remove it with create-dev-realm.sh --remove and run again.
            quiet: true

    - name: Read the dev realm attributes
      uri:
        url: "{{ keycloak_internal_url }}/admin/realms/{{ keycloak_dev_realm }}"
        headers:
          Authorization: "Bearer {{ kc_admin_token.json.access_token }}"
        ca_path: "{{ local_root_ca_cert }}"
        validate_certs: yes
        return_content: yes
      register: kc_dev_realm
      no_log: true
      run_once: true
    - name: Pin the dev realm Frontend URL to "{{ keycloak_internal_url }}"
      # A PUT replaces the whole attributes map: send the current attributes with frontendUrl set
      uri:
        url: "{{ keycloak_internal_url }}/admin/realms/{{ keycloak_dev_realm }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ kc_admin_token.json.access_token }}"
        body_format: json
        body:
          attributes: "{{ kc_dev_realm.json.attributes | default({}) | combine({'frontendUrl': keycloak_internal_url}) }}"
        ca_path: "{{ local_root_ca_cert }}"
        validate_certs: yes
        status_code: 204
      changed_when: true
      no_log: true
      when: kc_dev_realm.json.attributes.frontendUrl | default('') != keycloak_internal_url
      run_once: true

    ##################
    ##### Checks #####
    ##################
    - name: Read the dev realm discovery document
      uri:
        url: "{{ dev_issuer }}/.well-known/openid-configuration"
        ca_path: "{{ local_root_ca_cert }}"
        validate_certs: yes
        return_content: yes
      register: dev_discovery
      run_once: true
    - name: Fail if the dev realm issuer or authorization endpoint is not on "{{ keycloak_internal_url }}"
      assert:
        that:
          - dev_discovery.json.issuer == dev_issuer
          - dev_discovery.json.authorization_endpoint.startswith(keycloak_internal_url ~ '/')
        fail_msg: >-
          issuer={{ dev_discovery.json.issuer }}, authorization_endpoint={{ dev_discovery.json.authorization_endpoint }}:
          both must be on {{ keycloak_internal_url }}
        quiet: true
      run_once: true
    - name: Open the dev realm login page (account-console client)
      uri:
        url: "{{ keycloak_internal_url }}/realms/{{ keycloak_dev_realm }}/protocol/openid-connect/auth?client_id=account-console&response_type=code&scope=openid&redirect_uri={{ (keycloak_internal_url ~ '/realms/' ~ keycloak_dev_realm ~ '/account/') | urlencode }}"
        ca_path: "{{ local_root_ca_cert }}"
        validate_certs: yes
        return_content: yes
        status_code: [200, 400]
      register: dev_login_page
      run_once: true
    - name: Fail if the dev realm login page is refused or sends the browser to "{{ keycloak_public_url }}"
      # The discovery check above already proves the Frontend URL is internal (Keycloak builds the login-actions
      # URLs from the same setting). The page itself is only checked for what must not be there: a link to the public
      # URL, where the login would go through Cloudflare Access and lose the session cookie. Its markup is not
      # parsed (the login theme decides how the form action is written: relative, absolute or inside a script).
      assert:
        that:
          - dev_login_page.status == 200
          - not (keycloak_public_hostname | bool) or keycloak_public_url ~ '/realms/' ~ keycloak_dev_realm not in dev_login_page.content
        fail_msg: >-
          {{ (dev_login_page.status == 400) | ternary(
          'Keycloak refused the account-console redirect URI (HTTP 400, Invalid parameter: redirect_uri): the built-in
          clients still point at /realms/' ~ keycloak_dev_source_realm ~ '/. A realm created before the path rewrite in
          filter_plugins/keycloak_realm.py has this problem: run create-dev-realm.sh --remove, then create-dev-realm.sh.',
          'The ' ~ keycloak_dev_realm ~ ' login page links to ' ~ keycloak_public_url ~ '/realms/' ~ keycloak_dev_realm
          ~ ': its Frontend URL is not ' ~ keycloak_internal_url ~ ' (Realm settings > General > Frontend URL).') }}
        quiet: true
      run_once: true
    - name: Summary
      debug:
        msg:
          - "Realm {{ keycloak_dev_realm }} {{ 'created from ' ~ keycloak_dev_source_realm if not dev_realm_exists else 'already there' }}, issuer {{ dev_issuer }}"
          - "Next steps (admin console {{ keycloak_internal_url }}/admin/master/console/#/{{ keycloak_dev_realm }}):"
          - "- Users: create the dev users and give them the client roles (a partial export has no users)"
          - "- Confidential clients have new secrets (Clients > <client> > Credentials): put them in the local server/config/service_config.json with realm {{ keycloak_dev_realm }}"
          - "- Local services: realm {{ keycloak_dev_realm }}, Keycloak URL and issuer {{ keycloak_internal_url }}"
          - "- Optional: block /realms/{{ keycloak_dev_realm }} on {{ keycloak_public_url }} in Cloudflare, like /realms/master"
      run_once: true
