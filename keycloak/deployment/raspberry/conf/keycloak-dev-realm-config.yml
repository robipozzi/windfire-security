# Development realm settings, used by keycloak-dev-realm.yaml (keycloak/deployment/create-dev-realm.sh)
# The dev realm is a copy of keycloak_dev_source_realm (realm settings, clients, client scopes, mappers, roles, groups;
# new client secrets, new signing keys) whose Frontend URL is pinned to keycloak_internal_url: its login
# pages, cookies and token issuer stay on the LAN, so a UI running on localhost logs in without the Cloudflare
# Tunnel or Cloudflare Access. The source realm is only read, never changed.
keycloak_dev_realm: windfire-dev
keycloak_dev_realm_display_name: Windfire DEV
keycloak_dev_source_realm: windfire
# present: create the realm if missing (never overwritten) and pin its Frontend URL; absent: delete the realm
keycloak_dev_realm_state: present
# Copy the users of the source realm (profile, attributes, required actions, realm and client roles, groups) on every
# run; users already in the dev realm are skipped, never overwritten. Passwords and OTP are not readable through the
# admin API: the copies have no credentials until they are set in the dev realm's admin console.
keycloak_dev_copy_users: true
# Users read in one page (the playbook fails if the source realm has this many or more)
keycloak_dev_users_max: 1000
