# Keycloak TLS deployment settings, used by keycloak-tls-deploy.yaml
# Local (controller) files, produced by keycloak/security/setupTLS.sh option 2 (Production)
local_certs_dir: "{{ lookup('env', 'HOME') }}/opt/keycloak/ssl/certs/raspberry"
local_root_ca_cert: "{{ lookup('env', 'HOME') }}/opt/keycloak/ssl/truststore/WindfireKeycloakRootCA.crt"
keycloak_cert_name: windfire-keycloak
# Remote (raspberry01) Keycloak settings
keycloak_conf: /etc/keycloak/keycloak.conf
keycloak_tls_dir: /etc/keycloak/tls
keycloak_tls_owner: root
keycloak_tls_group: keycloak
keycloak_service: keycloak
keycloak_user: keycloak
keycloak_https_port: 8443
# Internal URL: admin console and back-end calls (auth server token/userinfo/JWKS) always use it
keycloak_internal_url: "https://{{ inventory_hostname }}:{{ keycloak_https_port }}"
# Public URL (hostname v2 'hostname', issuer of the application realms), e.g. the cloudflared tunnel URL: https, no trailing slash.
# Default = internal URL, nothing changes. When it differs, keycloak.conf also gets hostname-admin (internal URL),
# hostname-backchannel-dynamic=true, proxy-headers=xforwarded and proxy-trusted-addresses=127.0.0.1 (cloudflared on localhost),
# and keycloak-tls-deploy.yaml pins the master realm Frontend URL to the internal URL (admin login stays internal;
# needs WINDFIRE_KC_ADMIN_USERNAME/PASSWORD or asks for them).
# Changing it changes the token issuer: set KEYCLOAK_ISSUER_URL of the auth server to the same URL (deployment/deploy.sh)
keycloak_public_hostname_url: "https://auth.windfire.cc"
# Public or LAN-only access, as recorded on the Pi by windfire-raspberry's switch-windfire-exposure.sh
# (/etc/ansible/facts.d/windfire.fact, read here as ansible_local.windfire.exposure; no file means public).
# While Windfire is LAN-only, keycloak_public_url is the internal URL, so a TLS deploy or an upgrade keeps that mode.
# The switch itself passes -e keycloak_public_url=... explicitly.
windfire_exposure: "{{ ansible_local.windfire.exposure | default('public') }}"
keycloak_public_url: "{{ keycloak_internal_url if windfire_exposure == 'lan' else keycloak_public_hostname_url }}"
keycloak_public_hostname: "{{ keycloak_public_url != keycloak_internal_url }}"
# Old self-signed certificate and key, moved to a backup folder after a successful switch
old_server_cert: server.crt.pem
old_server_key: server.key.pem
# Set to true (-e keycloak_force_build=true) to always run kc.sh build
keycloak_force_build: false
