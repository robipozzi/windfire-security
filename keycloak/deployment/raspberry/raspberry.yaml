--- # Ansible Playbook to configure a set of Raspberry PIs in a consistent and repeatable way
# Software installation and configuration for Raspberry PI box
- hosts: identitymanager
  remote_user: "{{ user }}"
  become: yes
  vars:
    src_dir: "{{ playbook_dir }}"
    mode: u=rwx
  vars_files:
    - "{{ src_dir }}/conf/raspberry-config.yml"
  tasks:
    ###############################################
    ##### Update package manager repositories #####
    ###############################################
    - name: Update package manager repositories cache
      apt:
        update_cache: yes
    ######################################
    ##### Upgrade installed packages #####
    ######################################
    - name: Upgrade installed packages
      apt:
        upgrade: dist
    ########################
    ##### Java Section #####
    ########################
    - name: Check if the OS release provides OpenJDK 21
      command: apt-cache policy openjdk-21-jdk-headless
      register: jdk21_policy
      changed_when: false
      check_mode: false
    - name: Choose headless OpenJDK package (21 if available, otherwise 17)
      set_fact:
        jdk_package: "{{ (jdk21_policy.stdout is search('Candidate: (?!\\(none\\))')) | ternary('openjdk-21-jdk-headless', 'openjdk-17-jdk-headless') }}"
    - name: Install OpenJDK ({{ jdk_package }})
      apt:
        name: "{{ jdk_package }}"
        state: present
