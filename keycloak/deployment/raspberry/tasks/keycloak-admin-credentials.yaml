---
# Set kc_admin_username/kc_admin_password from WINDFIRE_KC_ADMIN_USERNAME/PASSWORD, asking for the missing ones.
# Included by keycloak-tls-deploy.yaml on the controller
- name: Ask for the Keycloak admin username (WINDFIRE_KC_ADMIN_USERNAME not set)
  pause:
    prompt: "Keycloak master realm admin username"
  register: kc_admin_username_prompt
  when: lookup('env', 'WINDFIRE_KC_ADMIN_USERNAME') | length == 0
- name: Ask for the Keycloak admin password (WINDFIRE_KC_ADMIN_PASSWORD not set)
  pause:
    prompt: "Keycloak master realm admin password"
    echo: no
  register: kc_admin_password_prompt
  when: lookup('env', 'WINDFIRE_KC_ADMIN_PASSWORD') | length == 0
- name: Set the Keycloak admin credentials
  set_fact:
    kc_admin_username: "{{ lookup('env', 'WINDFIRE_KC_ADMIN_USERNAME') | default(kc_admin_username_prompt.user_input | default(''), true) | trim }}"
    kc_admin_password: "{{ lookup('env', 'WINDFIRE_KC_ADMIN_PASSWORD') | default(kc_admin_password_prompt.user_input | default(''), true) }}"
  no_log: true
