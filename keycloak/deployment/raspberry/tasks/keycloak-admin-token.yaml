---
# Get a master realm admin token as admin-cli with kc_admin_username/kc_admin_password into kc_admin_token,
# fail with Keycloak's error and a hint otherwise. Imported by keycloak-tls-deploy.yaml (pre-flight and Frontend URL pin),
# which runs it on the controller (delegate_to: localhost, become: no, run_once)
- name: Get an admin token from "{{ keycloak_internal_url }}"
  uri:
    url: "{{ keycloak_internal_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ kc_admin_username }}"
      password: "{{ kc_admin_password }}"
    ca_path: "{{ local_root_ca_cert }}"
    validate_certs: yes
    # no_log hides the whole result: accept Keycloak's refusals here and report error/error_description
    # (never a secret) in the next task, instead of a censored "HTTP Error 400"
    status_code: [200, 400, 401, 403]
  register: kc_admin_token
  no_log: true
- name: Fail if Keycloak refused the admin login
  assert:
    that: kc_admin_token.status == 200
    fail_msg: >-
      Keycloak refused the admin-cli password login on {{ keycloak_internal_url }}/realms/master:
      HTTP {{ kc_admin_token.status }}, error={{ kc_admin_token.json.error | default('?') }},
      error_description={{ kc_admin_token.json.error_description | default('?') }}.
      {{ kc_admin_hints[kc_admin_token.json.error_description | default('')] | default('') }}
      Details: sudo journalctl -u {{ keycloak_service }} | grep LOGIN_ERROR (on {{ inventory_hostname }})
    quiet: true
  vars:
    kc_admin_hints:
      "Invalid user credentials": "Wrong username or password (Keycloak 26.8 answers 400 for it, older 26.x 401), or the user has OTP, or brute-force detection locked it."
      "Account is not fully set up": "The user has pending required actions (e.g. Update Password, Verify Profile: missing email/first/last name): log in once to the admin console, or clear them in Users > <user> > Required user actions."
      "Account disabled": "Enable the user in the master realm (Users > <user> > Enabled)."
      "Client not allowed for direct access grants": "Turn on Direct access grants for the admin-cli client of the master realm."
