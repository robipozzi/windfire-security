--- # Ansible Playbook to deploy Keycloak server certificate signed by Windfire Keycloak Root CA
# Copy certificate and key, update keycloak.conf (TLS files, cache=local, hostname and reverse proxy options),
# stop, build if a build option changed, restart Keycloak, pin the master realm to the internal URL when a public URL is set,
# check the issuers and the admin console, backup old certificate and key
# The systemd unit is re-templated on every run from templates/keycloak.service.j2, with keycloak_home and JAVA_HOME
# read from the running unit (so it follows the keycloak-upgrade.yaml drop-in): a change restarts Keycloak
- hosts: identitymanager
  remote_user: "{{ user }}"
  become: yes
  vars:
    src_dir: "{{ playbook_dir }}"
    local_server_cert: "{{ local_certs_dir }}/{{ keycloak_cert_name }}.crt"
    local_server_key: "{{ local_certs_dir }}/{{ keycloak_cert_name }}.key"
    remote_server_cert: "{{ keycloak_tls_dir }}/{{ keycloak_cert_name }}.crt"
    remote_server_key: "{{ keycloak_tls_dir }}/{{ keycloak_cert_name }}.key"
    # Realm whose issuer must be the public URL (its check is skipped while the realm does not exist)
    keycloak_issuer_realm: windfire
  vars_files:
    - "{{ src_dir }}/conf/raspberry-config.yml"
    - "{{ src_dir }}/conf/keycloak-tls-config.yml"
  tasks:
    ##################################################
    ##### Pre-flight checks on local certificate #####
    ##################################################
    - name: Find OpenSSL 3 on the controller (Homebrew openssl@3 if available)
      set_fact:
        openssl_bin: "{{ (brew_openssl_prefix | length > 0) | ternary(brew_openssl_prefix ~ '/bin/openssl', 'openssl') }}"
      vars:
        brew_openssl_prefix: "{{ lookup('pipe', 'brew --prefix openssl@3 2>/dev/null || true') }}"
      run_once: true
    - name: Check local certificate, key and Windfire Keycloak Root CA exist
      stat:
        path: "{{ item }}"
      loop:
        - "{{ local_server_cert }}"
        - "{{ local_server_key }}"
        - "{{ local_root_ca_cert }}"
      register: local_tls_files
      delegate_to: localhost
      become: no
      run_once: true
    - name: Fail if any local file is missing
      assert:
        that: item.stat.exists
        fail_msg: "{{ item.item }} not found, generate it with keycloak/security/setupTLS.sh (option 2, Production)"
        quiet: true
      loop: "{{ local_tls_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      run_once: true
    - name: Verify certificate is signed by Windfire Keycloak Root CA
      command: "{{ openssl_bin }} verify -CAfile {{ local_root_ca_cert }} {{ local_server_cert }}"
      changed_when: false
      check_mode: false
      delegate_to: localhost
      become: no
      run_once: true
    - name: Verify certificate is not expired
      command: "{{ openssl_bin }} x509 -in {{ local_server_cert }} -noout -checkend 0"
      changed_when: false
      check_mode: false
      delegate_to: localhost
      become: no
      run_once: true
    - name: Read certificate public key
      command: "{{ openssl_bin }} x509 -in {{ local_server_cert }} -noout -pubkey"
      register: local_cert_pubkey
      changed_when: false
      check_mode: false
      delegate_to: localhost
      become: no
      run_once: true
    - name: Read private key public key
      command: "{{ openssl_bin }} pkey -in {{ local_server_key }} -pubout"
      register: local_key_pubkey
      changed_when: false
      check_mode: false
      delegate_to: localhost
      become: no
      run_once: true
    - name: Fail if certificate and private key do not match
      assert:
        that: local_cert_pubkey.stdout == local_key_pubkey.stdout
        fail_msg: "{{ local_server_cert }} and {{ local_server_key }} do not match"
        quiet: true
      run_once: true
    - name: Fail if keycloak_public_url is not an https URL without trailing slash
      assert:
        that: keycloak_public_url is match('^https://[^/]+(/.*[^/])?$')
        fail_msg: "keycloak_public_url must be an https URL without trailing slash, got: {{ keycloak_public_url }}"
        quiet: true
    ###############################################
    ##### Pre-flight checks on remote Keycloak #####
    ###############################################
    - name: Check "{{ keycloak_conf }}" exists
      stat:
        path: "{{ keycloak_conf }}"
      register: keycloak_conf_file
    - name: Fail if "{{ keycloak_conf }}" is missing
      assert:
        that: keycloak_conf_file.stat.exists
        fail_msg: "{{ keycloak_conf }} not found on {{ inventory_hostname }}"
        quiet: true
    - name: Check "{{ keycloak_tls_group }}" group exists
      getent:
        database: group
        key: "{{ keycloak_tls_group }}"
    - name: Read Keycloak systemd unit ExecStart
      command: "systemctl show {{ keycloak_service }} -p ExecStart --value"
      register: keycloak_exec_start
      changed_when: false
      check_mode: false
    - name: Read Keycloak systemd unit Environment
      command: "systemctl show {{ keycloak_service }} -p Environment --value"
      register: keycloak_unit_env
      changed_when: false
      check_mode: false
    - name: Set Keycloak facts from systemd unit
      set_fact:
        kc_sh: "{{ keycloak_exec_start.stdout | regex_search('path=([^ ;]+)', '\\1') | default([''], true) | first }}"
        backup_stamp: "{{ ansible_facts.date_time.date | replace('-', '') }}-{{ ansible_facts.date_time.hour }}{{ ansible_facts.date_time.minute }}{{ ansible_facts.date_time.second }}"
    - name: Set keycloak_home and java_home for the systemd unit from the running unit
      set_fact:
        # kc_sh is <keycloak_home>/bin/kc.sh, from the upgrade drop-in's ExecStart if there is one
        keycloak_home: "{{ kc_sh | dirname | dirname }}"
        java_home: "{{ unit_env.JAVA_HOME | default(java_home_fallback, true) }}"
      vars:
        unit_env: "{{ dict(keycloak_unit_env.stdout.split() | reject('match', 'KEYCLOAK_ADMIN') | map('regex_search', '^([^=]+)=(.*)$', '\\1', '\\2') | select | list) }}"
    ######################################
    ##### Install the systemd unit   #####
    ######################################
    - name: Fail if kc.sh cannot be found in Keycloak systemd unit
      assert:
        that: kc_sh is search('kc\.sh$')
        fail_msg: "kc.sh not found in {{ keycloak_service }} ExecStart ({{ keycloak_exec_start.stdout }}), cannot template the unit"
        quiet: true
    - name: Ensure "{{ keycloak_home }}/data" exists (the unit's only ReadWritePaths, it must exist before the start)
      file:
        path: "{{ keycloak_home }}/data"
        state: directory
        owner: "{{ keycloak_user }}"
        group: "{{ keycloak_group }}"
        mode: "0750"
    - name: Install Keycloak systemd unit
      template:
        src: "{{ src_dir }}/templates/keycloak.service.j2"
        dest: "/etc/systemd/system/{{ keycloak_service }}.service"
        owner: root
        group: root
        mode: "0644"
        backup: yes
      register: keycloak_unit
    ##########################################################
    ##### Copy server certificate and key to raspberry01 #####
    ##########################################################
    - name: Ensure "{{ keycloak_tls_dir }}" remote directory exists
      file:
        path: "{{ keycloak_tls_dir }}"
        state: directory
        owner: "{{ keycloak_tls_owner }}"
        group: "{{ keycloak_tls_group }}"
        mode: "0750"
    - name: Copy server certificate to "{{ remote_server_cert }}"
      copy:
        src: "{{ local_server_cert }}"
        dest: "{{ remote_server_cert }}"
        owner: "{{ keycloak_tls_owner }}"
        group: "{{ keycloak_tls_group }}"
        mode: "0640"
        backup: yes
      register: tls_cert_copy
    - name: Copy server key to "{{ remote_server_key }}"
      copy:
        src: "{{ local_server_key }}"
        dest: "{{ remote_server_key }}"
        owner: "{{ keycloak_tls_owner }}"
        group: "{{ keycloak_tls_group }}"
        mode: "0640"
        backup: yes
      register: tls_key_copy
      no_log: true
    ############################################
    ##### Update keycloak.conf if needed   #####
    ############################################
    - name: Set https-certificate-file in "{{ keycloak_conf }}"
      lineinfile:
        path: "{{ keycloak_conf }}"
        regexp: '^https-certificate-file='
        line: "https-certificate-file={{ remote_server_cert }}"
        backup: yes
      register: kc_conf_cert
    - name: Set https-certificate-key-file in "{{ keycloak_conf }}"
      lineinfile:
        path: "{{ keycloak_conf }}"
        regexp: '^https-certificate-key-file='
        line: "https-certificate-key-file={{ remote_server_key }}"
        backup: yes
      register: kc_conf_key
    - name: Remove https-key-store-* lines from "{{ keycloak_conf }}"
      lineinfile:
        path: "{{ keycloak_conf }}"
        regexp: '^https-key-store-'
        state: absent
        backup: yes
      register: kc_conf_keystore
    - name: Set cache=local in "{{ keycloak_conf }}" (single node, no JGroups cluster discovery)
      lineinfile:
        path: "{{ keycloak_conf }}"
        regexp: '^\s*cache\s*='
        line: "cache=local"
        backup: yes
      register: kc_conf_cache
    # Hostname v2 and reverse proxy: hostname always, the other four only with a public URL (removed otherwise)
    - name: Set hostname and reverse proxy options in "{{ keycloak_conf }}"
      lineinfile:
        path: "{{ keycloak_conf }}"
        regexp: '^\s*{{ item.key }}\s*='
        line: "{{ item.key }}={{ item.value }}"
        state: "{{ (item.enabled | bool) | ternary('present', 'absent') }}"
        backup: yes
      loop:
        - { key: hostname, value: "{{ keycloak_public_url }}", enabled: true }
        - { key: hostname-admin, value: "{{ keycloak_internal_url }}", enabled: "{{ keycloak_public_hostname }}" }
        - { key: hostname-backchannel-dynamic, value: "true", enabled: "{{ keycloak_public_hostname }}" }
        - { key: proxy-headers, value: xforwarded, enabled: "{{ keycloak_public_hostname }}" }
        - { key: proxy-trusted-addresses, value: "127.0.0.1", enabled: "{{ keycloak_public_hostname }}" }
      loop_control:
        label: "{{ item.key }}"
      register: kc_conf_hostname
    - name: Decide if Keycloak must be restarted and built
      set_fact:
        kc_conf_changed: "{{ kc_conf_cert is changed or kc_conf_key is changed or kc_conf_keystore is changed or kc_conf_cache is changed or kc_conf_hostname is changed }}"
        # Each lineinfile backs up keycloak.conf before its own change: the first backup taken is the original file
        kc_conf_backup: "{{ ([kc_conf_cert.backup | default(''), kc_conf_key.backup | default(''), kc_conf_keystore.backup | default(''), kc_conf_cache.backup | default('')] + (kc_conf_hostname.results | map(attribute='backup', default='') | list)) | select | first | default('') }}"
        restart_needed: "{{ tls_cert_copy is changed or tls_key_copy is changed or kc_conf_cert is changed or kc_conf_key is changed or kc_conf_keystore is changed or kc_conf_cache is changed or kc_conf_hostname is changed or keycloak_unit is changed or keycloak_force_build | bool }}"
        # cache is a build option, read only by kc.sh build when Keycloak starts --optimized: build whenever keycloak.conf changed, or if forced.
        # Hostname and proxy options are runtime options (not in kc.sh build --help): a restart is enough
        build_needed: "{{ keycloak_force_build | bool or kc_conf_cert is changed or kc_conf_key is changed or kc_conf_keystore is changed or kc_conf_cache is changed }}"
    ######################################################
    ##### Stop, build if needed and restart Keycloak #####
    ######################################################
    - name: Stop, build and restart Keycloak, rolling back on failure
      block:
        - name: Stop Keycloak
          systemd:
            name: "{{ keycloak_service }}"
            state: stopped
          when: restart_needed | bool
        - name: Fail if kc.sh cannot be found in Keycloak systemd unit
          assert:
            that: kc_sh is search('kc\.sh$')
            fail_msg: "kc.sh not found in {{ keycloak_service }} ExecStart ({{ keycloak_exec_start.stdout }}), cannot build Keycloak"
            quiet: true
          when: build_needed | bool
        - name: Build Keycloak
          command: "{{ kc_sh }} --config-file={{ keycloak_conf }} build"
          become_user: "{{ keycloak_user }}"
          environment: "{{ dict(keycloak_unit_env.stdout.split() | map('regex_search', '^([^=]+)=(.*)$', '\\1', '\\2') | select | list) }}"
          when: build_needed | bool
        - name: Start Keycloak
          systemd:
            name: "{{ keycloak_service }}"
            state: started
            daemon_reload: yes
        - name: Wait for Keycloak to serve the new certificate over HTTPS
          uri:
            url: "https://{{ inventory_hostname }}:{{ keycloak_https_port }}/realms/master/"
            ca_path: "{{ local_root_ca_cert }}"
            validate_certs: yes
          register: keycloak_https_check
          until: keycloak_https_check.status == 200
          retries: 24
          delay: 5
          delegate_to: localhost
          become: no
        # With a public URL, the master realm gets a Frontend URL equal to the internal URL: its issuer, and the admin
        # console login (hostname-admin alone still posts the master login form to the public URL), stay on the
        # internal URL, so admin login works with the tunnel off and /realms/master need not be public.
        # The Frontend URL is a realm attribute (database), set through the admin REST API from the controller.
        # Back at the default URL a pinned Frontend URL equals hostname, so it is left as is
        - name: Read master realm issuer over "{{ keycloak_internal_url }}"
          uri:
            url: "{{ keycloak_internal_url }}/realms/master/.well-known/openid-configuration"
            ca_path: "{{ local_root_ca_cert }}"
            validate_certs: yes
            return_content: yes
          register: master_discovery
          check_mode: false
          delegate_to: localhost
          become: no
          run_once: true
        - name: Pin the master realm Frontend URL to "{{ keycloak_internal_url }}"
          when:
            - keycloak_public_hostname | bool
            - master_discovery.json.issuer != keycloak_internal_url ~ '/realms/master'
            - not ansible_check_mode
          delegate_to: localhost
          become: no
          run_once: true
          block:
            - name: Ask for the Keycloak admin username (WINDFIRE_KC_ADMIN_USERNAME not set)
              pause:
                prompt: "Keycloak master realm admin username, to set the master realm Frontend URL"
              register: kc_admin_username_prompt
              when: lookup('env', 'WINDFIRE_KC_ADMIN_USERNAME') | length == 0
            - name: Ask for the Keycloak admin password (WINDFIRE_KC_ADMIN_PASSWORD not set)
              pause:
                prompt: "Keycloak master realm admin password"
                echo: no
              register: kc_admin_password_prompt
              when: lookup('env', 'WINDFIRE_KC_ADMIN_PASSWORD') | length == 0
            - name: Get an admin token from "{{ keycloak_internal_url }}"
              uri:
                url: "{{ keycloak_internal_url }}/realms/master/protocol/openid-connect/token"
                method: POST
                body_format: form-urlencoded
                body:
                  grant_type: password
                  client_id: admin-cli
                  username: "{{ lookup('env', 'WINDFIRE_KC_ADMIN_USERNAME') | default(kc_admin_username_prompt.user_input | default(''), true) | trim }}"
                  password: "{{ lookup('env', 'WINDFIRE_KC_ADMIN_PASSWORD') | default(kc_admin_password_prompt.user_input | default(''), true) }}"
                ca_path: "{{ local_root_ca_cert }}"
                validate_certs: yes
                # no_log hides the whole result: accept Keycloak's refusals here and report error/error_description
                # (never a secret) in the next task, instead of a censored "HTTP Error 400"
                status_code: [200, 400, 401, 403]
              register: kc_admin_token
              no_log: true
            - name: Fail if Keycloak refused the admin login
              assert:
                that: kc_admin_token.status == 200
                fail_msg: >-
                  Keycloak refused the admin-cli password login on {{ keycloak_internal_url }}/realms/master:
                  HTTP {{ kc_admin_token.status }}, error={{ kc_admin_token.json.error | default('?') }},
                  error_description={{ kc_admin_token.json.error_description | default('?') }}.
                  {{ kc_admin_hints[kc_admin_token.json.error_description | default('')] | default('') }}
                  Details: sudo journalctl -u {{ keycloak_service }} | grep LOGIN_ERROR (on {{ inventory_hostname }})
                quiet: true
              vars:
                kc_admin_hints:
                  "Invalid user credentials": "Wrong username or password (or the user has OTP, or brute-force detection locked it)."
                  "Account is not fully set up": "The user has pending required actions (e.g. Update Password, Verify Profile: missing email/first/last name): log in once to the admin console, or clear them in Users > <user> > Required user actions."
                  "Account disabled": "Enable the user in the master realm (Users > <user> > Enabled)."
                  "Client not allowed for direct access grants": "Turn on Direct access grants for the admin-cli client of the master realm."
            - name: Read the master realm attributes
              uri:
                url: "{{ keycloak_internal_url }}/admin/realms/master"
                headers:
                  Authorization: "Bearer {{ kc_admin_token.json.access_token }}"
                ca_path: "{{ local_root_ca_cert }}"
                validate_certs: yes
                return_content: yes
              register: kc_master_realm
              no_log: true
            - name: Set the master realm Frontend URL attribute
              # A PUT replaces the whole attributes map: send the current attributes with frontendUrl added
              uri:
                url: "{{ keycloak_internal_url }}/admin/realms/master"
                method: PUT
                headers:
                  Authorization: "Bearer {{ kc_admin_token.json.access_token }}"
                body_format: json
                body:
                  attributes: "{{ kc_master_realm.json.attributes | default({}) | combine({'frontendUrl': keycloak_internal_url}) }}"
                ca_path: "{{ local_root_ca_cert }}"
                validate_certs: yes
                status_code: 204
              changed_when: true
              no_log: true
            - name: Read master realm issuer again
              uri:
                url: "{{ keycloak_internal_url }}/realms/master/.well-known/openid-configuration"
                ca_path: "{{ local_root_ca_cert }}"
                validate_certs: yes
                return_content: yes
              register: master_discovery_pinned
        - name: Fail if the master realm issuer is not "{{ keycloak_internal_url }}/realms/master"
          assert:
            that: master_issuer == keycloak_internal_url ~ '/realms/master'
            fail_msg: "master realm issuer is {{ master_issuer }}, expected {{ keycloak_internal_url }}/realms/master"
            quiet: true
          vars:
            # A skipped task still registers its variable: use the second read only if the pin ran
            master_issuer: "{{ (master_discovery_pinned is skipped) | ternary(master_discovery.json.issuer, master_discovery_pinned.json.issuer | default('')) }}"
          when: not ansible_check_mode
          run_once: true
        - name: Read {{ keycloak_issuer_realm }} realm issuer over "{{ keycloak_internal_url }}"
          uri:
            url: "{{ keycloak_internal_url }}/realms/{{ keycloak_issuer_realm }}/.well-known/openid-configuration"
            ca_path: "{{ local_root_ca_cert }}"
            validate_certs: yes
            return_content: yes
            status_code: [200, 404]
          register: realm_discovery
          check_mode: false
          delegate_to: localhost
          become: no
          run_once: true
        - name: Fail if the {{ keycloak_issuer_realm }} realm issuer is not "{{ keycloak_public_url }}/realms/{{ keycloak_issuer_realm }}"
          assert:
            that: realm_discovery.json.issuer == keycloak_public_url ~ '/realms/' ~ keycloak_issuer_realm
            fail_msg: "{{ keycloak_issuer_realm }} realm issuer is {{ realm_discovery.json.issuer }}, expected {{ keycloak_public_url }}/realms/{{ keycloak_issuer_realm }}"
            quiet: true
          when: realm_discovery.status == 200
          run_once: true
        - name: Check the admin console answers on "{{ keycloak_internal_url }}"
          uri:
            url: "{{ keycloak_internal_url }}/admin/master/console/"
            ca_path: "{{ local_root_ca_cert }}"
            validate_certs: yes
          check_mode: false
          delegate_to: localhost
          become: no
          run_once: true
      rescue:
        - name: Restore previous certificate, key, keycloak.conf and systemd unit
          copy:
            src: "{{ item.backup }}"
            dest: "{{ item.dest }}"
            remote_src: yes
          loop:
            - { backup: "{{ tls_cert_copy.backup_file | default('') }}", dest: "{{ remote_server_cert }}" }
            - { backup: "{{ tls_key_copy.backup_file | default('') }}", dest: "{{ remote_server_key }}" }
            - { backup: "{{ kc_conf_backup }}", dest: "{{ keycloak_conf }}" }
            - { backup: "{{ keycloak_unit.backup_file | default('') }}", dest: "/etc/systemd/system/{{ keycloak_service }}.service" }
          loop_control:
            label: "{{ item.dest }}"
          when: item.backup | length > 0
          no_log: true
        - name: Rebuild Keycloak with previous keycloak.conf
          # The build may already hold the new build options (cache): match it to the restored file before restarting
          command: "{{ kc_sh }} --config-file={{ keycloak_conf }} build"
          become_user: "{{ keycloak_user }}"
          environment: "{{ dict(keycloak_unit_env.stdout.split() | map('regex_search', '^([^=]+)=(.*)$', '\\1', '\\2') | select | list) }}"
          when: build_needed | bool and kc_sh is search('kc\.sh$')
        - name: Restart Keycloak with previous configuration
          systemd:
            name: "{{ keycloak_service }}"
            state: restarted
            daemon_reload: yes
        - name: Fail after rollback
          fail:
            # The block also pins the master Frontend URL and checks the issuers: name the task that failed, not only the start
            msg: >-
              Task "{{ ansible_failed_task.name | default('unknown') }}" failed{{ (ansible_failed_result.msg | default('') | length > 0) | ternary(': ' ~ ansible_failed_result.msg | default(''), '') }}.
              Previous certificate, key, keycloak.conf and systemd unit restored and Keycloak restarted.
              Check the error above and: journalctl -u {{ keycloak_service }}
    ###########################################################
    ##### Backup old server.crt.pem and server.key.pem    #####
    ###########################################################
    - name: Check old server certificate and key
      stat:
        path: "{{ keycloak_tls_dir }}/{{ item }}"
      loop:
        - "{{ old_server_cert }}"
        - "{{ old_server_key }}"
      register: old_tls_files
    - name: List old server certificate and key to backup
      set_fact:
        # Regular files only: missing files have no isreg, an empty name would stat the tls directory itself
        old_tls_to_backup: "{{ old_tls_files.results | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg') | map(attribute='item') | list }}"
    - name: Ensure "{{ keycloak_tls_dir }}/backup-{{ backup_stamp }}" remote directory exists
      file:
        path: "{{ keycloak_tls_dir }}/backup-{{ backup_stamp }}"
        state: directory
        owner: "{{ keycloak_tls_owner }}"
        group: "{{ keycloak_tls_group }}"
        mode: "0750"
      when: old_tls_to_backup | length > 0
    - name: Move old server certificate and key to "{{ keycloak_tls_dir }}/backup-{{ backup_stamp }}"
      command:
        cmd: "mv {{ keycloak_tls_dir }}/{{ item }} {{ keycloak_tls_dir }}/backup-{{ backup_stamp }}/{{ item }}"
        removes: "{{ keycloak_tls_dir }}/{{ item }}"
        creates: "{{ keycloak_tls_dir }}/backup-{{ backup_stamp }}/{{ item }}"
      loop: "{{ old_tls_to_backup }}"
    #####################
    ##### Summary   #####
    #####################
    - name: Read deployed server certificate
      command: "openssl x509 -in {{ remote_server_cert }} -noout -subject -issuer -enddate"
      register: deployed_cert
      changed_when: false
      when: not ansible_check_mode
    - name: Show deployment summary
      debug:
        msg:
          - "{{ deployed_cert.stdout_lines | default(['certificate not read in check mode']) }}"
          - "keycloak.conf changed: {{ kc_conf_changed }} (backup: {{ kc_conf_backup | default('none', true) }})"
          - "Public URL ({{ keycloak_issuer_realm }} issuer): {{ keycloak_public_url }}, admin console and master realm: {{ keycloak_internal_url }}"
          - "Systemd unit changed: {{ keycloak_unit is changed }} (backup: {{ keycloak_unit.backup_file | default('none', true) }})"
          - "Keycloak restarted: {{ restart_needed }}, built: {{ build_needed }}"
          - "Old certificate and key backup: {{ (old_tls_to_backup | length > 0) | ternary(keycloak_tls_dir ~ '/backup-' ~ backup_stamp, 'nothing to backup') }}"
